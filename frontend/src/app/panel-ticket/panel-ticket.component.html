<div class="row p-4">
    <div class="col">
        <h3 class="fw-bold">Panel de gestión de tickets</h3>
    </div>
    <div class="col d-flex justify-content-end gap-2">
        <input type="text" class="form-control w-25" placeholder="Buscar...">
        <button class="btn btn-primary">+ Nuevo</button>
    </div>
</div>

<div class="bg-light p-4">
    <div class="row">
        <div class="col-12 col-sm-6 col-lg-3 gy-3">
            <div class="card border-0 border-start border-primary border-5 shadow-sm rounded">
                <div class="card-body">
                    <p class="text-muted mb-0">TICKETS ABIERTOS</p>
                    <h1 class="mt-0 mb-0">187</h1>
                    <p class="text-primary small mb-0">+ 12 hoy</p>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 gy-3">
            <div class="card border-0 border-start border-warning border-5 shadow-sm rounded">
                <div class="card-body">
                    <p class="text-muted mb-0">EN CURSO</p>
                    <h1 class="mt-0 mb-0">94</h1>
                    <p class="text-warning small mb-0">asignados</p>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 gy-3">
            <div class="card border-0 border-start border-danger border-5 shadow-sm rounded">
                <div class="card-body">
                    <p class="text-muted mb-0">SLA EN RIESGO</p>
                    <h1 class="mt-0 mb-0">17</h1>
                    <p class="text-danger small mb-0">2 h restantes</p>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3 gy-3">
            <div class="card border-0 border-start border-success border-5 shadow-sm rounded">
                <div class="card-body">
                    <p class="text-muted mb-0">RESUELTOS (MES)</p>
                    <h1 class="mt-0 mb-0">612</h1>
                    <p class="text-success small mb-0">+ 12 hoy</p>

                </div>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-header">
            <h5 class="card-title fw-bold">Listado</h5>
        </div>
        <div class="card-body mt-0">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th class="bg-light">Nº TICKET</th>
                        <th class="bg-light">CLIENTE</th>
                        <th class="bg-light">CATEGORIA</th>
                        <th class="bg-light">TÉCNICO</th>
                        <th class="bg-light">PRIORIDAD</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- <tr>
                        <td>John</td>
                        <td>Doe</td>
                        <td>johnexample.com</td>
                    </tr> -->
                </tbody>
            </table>
        </div>
    </div>

</div>
