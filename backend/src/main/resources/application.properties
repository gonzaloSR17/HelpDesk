spring.application.name=helpdesk

# ═══════════════════════════════════════════════════════════
#  CONEXIÓN A MySQL 8.4
#  OJO! Cuidado con poner espacios después de los valores!
#  createDatabaseIfNotExist=true -> crea el esquema si no existe
# ═══════════════════════════════════════════════════════════
spring.datasource.url=jdbc:mysql://localhost:3306/helpdesk?useSSL=false&createDatabaseIfNotExist=true&serverTimezone=Europe/Madrid
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configurar JPA (ddl-auto=update o ddl-auto=create)
#   create   -> borra y recrea las tablas en cada arranque
#   update   -> crea si no existen, altera si hay cambios, NUNCA borra datos
#   validate -> solo verifica el esquema (recomendado en producción)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# [NUEVO] Cierra la sesión de Hibernate al salir del controlador.
# Con true (por defecto) se ocultan errores de carga perezosa que
# luego aparecen en producción. Es una buena práctica ponerlo a false.
spring.jpa.open-in-view=false

# Metemos swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ═══════════════════════════════════════════════════════════
#  [NUEVO] CARGA DE DATOS
#  false -> DatosIniciales queda como ejemplo docente pero NO inserta.
#           Los datos entran por POST /api/carga/... (apartado 3.6)
#  true  -> vuelve a insertar los 5 alumnos de ejemplo de la FASE 2
# ═══════════════════════════════════════════════════════════
app.datos-iniciales=false

# # ═══════════════════════════════════════════════════════════
# #  [NUEVO] SEGURIDAD JWT (FASE 8)
# #  ⚠️ La clave debe tener AL MENOS 32 caracteres (256 bits) para HS256.
# #  ⚠️ Sin esta propiedad la aplicación NO ARRANCA: JwtService la inyecta
# #     con @Value y no tiene valor por defecto.
# #  ⚠️ En un proyecto real va en una variable de entorno, NUNCA en git.
# # ═══════════════════════════════════════════════════════════
app.jwt.secreto=${JWT_SECRET:1309Programador??}
# Caducidad en milisegundos: 3600000 = 1 hora
app.jwt.caducidad=${JWT_EXPIRATION:3600000}