<section class="login-card">
    <h4 class="mb-1">Iniciar sesión</h4>

    <p class="small mb-4">Accede con tu cuenta de Arelance HelpDesk.</p>

    <form (ngSubmit)="iniciarSesion()" #formLogin="ngForm">

        <p class="mb-3">
            <label for="usuario" class="form-label small fw-bold">Usuario o email</label>
            <input type="text" id="usuario" class="form-control" placeholder="oscar.dev&#64;arelance-helpdesk.com"
                [(ngModel)]="usuario" name="usuario" required>
        </p>

        <p class="mb-3">
            <label for="password" class="form-label small fw-bold">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••••••" [(ngModel)]="password"
                name="password" required>
        </p>

        <p class="d-flex justify-content-between align-items-center mb-3">
            <label class="form-check">
                <input type="checkbox" name="recordarme" id="recordarme" class="form-check-input"
                    [(ngModel)]="recordarme">
                <span class="form-check-label small">Recordarme</span>
            </label>
            <a href="#" class="small">¿Olvidaste tu contraseña?</a>
        </p>

       @if (error) {
        <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
        }

        <button type="submit" class="btn btn-primary w-100 mb-4" [disabled]="cargando || formLogin.invalid">
            {{ cargando ? 'Entrando...' : 'Iniciar sesión' }}
        </button>

        <p class="text-center text-muted small mb-2">Un único acceso: tu rol decide lo que ves después</p>

        <p class="d-flex justify-content-center gap-2">
            <span class="badge rounded-pill role-badge role-cliente">Cliente</span>
            <span class="badge rounded-pill role-badge role-tecnico">Técnico</span>
            <span class="badge rounded-pill role-badge role-administrador">Administrador</span>
        </p>
    </form>
</section>
