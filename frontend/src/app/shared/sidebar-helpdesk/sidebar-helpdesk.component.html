<div class="w-100 h-100 bg-custom d-flex flex-column p-4">

    <div class="border-bottom border-secondary pb-2">
        <h5 class="text-white fw-bold mb-1">Arelance HelpDesk</h5>
        <p class="text-secondary small mb-2">Soporte Técnico</p>
    </div>

    <!-- List group elimina los bordes -->
    <!-- RouterLinkActive marca en la opcion que nos encontremos en el sidebar -->
    <ul class="list-group text-white list-group-flush mt-3 gap-1">
        @for (item of menuItems; track item.route) {
        <li [routerLink]="item.route" routerLinkActive="bg-primary text-white" [routerLinkActiveOptions]="{exact: true}"
            class="list-group-item sidebar-item text-secondary border-0 rounded-3 px-3 py-2" style="cursor: pointer;">
            ● &nbsp; {{ item.label }}
        </li>
        }
    </ul>

        <!-- Usuario abajo -->
    <div class="mt-auto border-top pt-3">
        <div class="d-flex align-items-center gap-2">
            <div class="avatar">{{ inicial }}</div>

            <div>
                <div class="text-white fw-bold small">{{ nombre }}</div>
                <div class="text-secondary small">{{ rol }}</div>
            </div>
        </div>

        <button type="button" class="btn btn-outline-light btn-sm w-100 mt-3" (click)="cerrarSesion()">
            Cerrar sesión
        </button>
    </div>


</div>
